<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿煙的家</title>
  <meta name="description" content="阿煙的網站。">
  <meta name="keywords" content="阿煙 , 獨立遊戲, indie game, 遊戲開發, 台灣, 武俠, 文字冒險">
  <meta property="og:title" content="阿煙  — 獨立遊戲開發者">
  <meta property="og:description" content="獨立遊戲開發者 · 數位創作者 · 用遊戲和圖畫說故事">
  <meta property="og:image" content="assets/images/og-image.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== Navigation ========== -->
  <nav class="navbar" role="navigation" aria-label="主要導覽">
    <div class="container">
      <a href="#" class="nav-logo" id="navLogo">首頁</a>
      <ul class="nav-links" id="navLinks">
        <!-- Dynamically generated by JS based on active sections -->
      </ul>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="theme-toggle" aria-label="切換深色/亮色模式" id="themeToggle">
          <span id="themeIcon">🌙</span>
        </button>
        <button class="hamburger" aria-label="開啟選單" id="hamburgerBtn">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Mobile menu (dynamically generated) -->
  <div class="mobile-menu" id="mobileMenu"></div>

  <!-- ========== Main Notice Bar ========== -->
  <div class="notice-bar" id="noticeBar" style="display:none;">
    <div class="notice-bar-inner">
      <span class="notice-bar-icon" id="noticeBarIcon"></span>
      <span class="notice-bar-text">
        <strong id="noticeBarTitle"></strong>
        <span id="noticeBarBody"></span>
      </span>
      <a class="notice-bar-link" id="noticeBarLink" href="#" target="_blank" rel="noopener noreferrer"></a>
      <button class="notice-bar-close" id="noticeBarClose" aria-label="關閉通知">&times;</button>
    </div>
  </div>

  <!-- Floating Notices Container -->
  <div class="floating-notices" id="floatingNotices"></div>

  <!-- ========== Banner Carousel ========== -->
  <section class="banner-carousel" id="bannerCarousel" aria-label="封面輪播" style="display:none;">
    <div class="banner-track" id="bannerTrack"></div>
    <button class="banner-nav banner-prev" id="bannerPrev" aria-label="上一張">&lsaquo;</button>
    <button class="banner-nav banner-next" id="bannerNext" aria-label="下一張">&rsaquo;</button>
    <div class="banner-dots" id="bannerDots"></div>
  </section>

  <!-- ========== Hero ========== -->
  <section class="hero section-toggle" id="hero" data-section="hero" aria-label="首頁橫幅">
    <div class="hero-bg-effect" id="heroBgEffect"></div>
    <canvas class="hero-canvas" id="heroCanvas"></canvas>
    <div class="hero-content">
      <p class="hero-tagline" id="heroTagline">INDIE GAME DEVELOPER & CREATOR</p>
      <h1 class="hero-heading" id="heroHeading">你好啊旅行者</h1>
      <p class="hero-subtitle" id="heroSubtitle">獨立遊戲開發者 · 數位創作者 · 用遊戲和圖畫說故事</p>
      <a href="#games" class="hero-cta" id="heroCta">查看作品 ↓</a>
    </div>
  </section>

  <!-- ========== Games ========== -->
  <section class="games section-toggle" id="games" data-section="games" aria-label="遊戲作品">
    <div class="container">
      <h2 class="section-title fade-in">遊戲作品</h2>
      <div id="gameFeatured" class="game-featured fade-in"></div>
      <div id="gamesGrid" class="games-grid"></div>
      <div id="gamesHidden" class="games-grid games-hidden"></div>
      <div class="games-toggle" id="gamesToggle" style="display:none;">
        <button class="games-toggle-btn" id="gamesToggleBtn">查看全部作品</button>
      </div>
    </div>
  </section>

  <!-- ========== Gallery (illustrator/vtuber) ========== -->
  <section class="gallery-section section-toggle" id="gallery" data-section="gallery" aria-label="作品集">
    <div class="container">
      <h2 class="section-title fade-in" id="galleryHeading">作品集</h2>
      <div id="galleryGrid" class="gallery-grid"></div>
    </div>
  </section>

  <!-- ========== Playlists (videoeditor/youtuber) ========== -->
  <section class="playlists-section section-toggle" id="playlists" data-section="playlists" aria-label="播放清單">
    <div class="container">
      <h2 class="section-title fade-in">播放清單</h2>
      <div class="playlist-tabs" id="playlistTabs"></div>
      <div id="playlistEmbeds" class="playlist-embeds"></div>
    </div>
  </section>

  <!-- ========== Video Showcase (videoeditor/youtuber) ========== -->
  <section class="video-showcase-section section-toggle" id="videoShowcase" data-section="videoShowcase" aria-label="影片作品">
    <div class="container">
      <h2 class="section-title fade-in">影片作品</h2>
      <div class="video-filters" id="videoFilters"></div>
      <div id="videosGrid" class="videos-grid"></div>
    </div>
  </section>

  <!-- ========== Content Feed ========== -->
  <section class="content-feed section-toggle" id="content-feed" data-section="contentFeed" aria-label="創作動態">
    <div class="container">
      <h2 class="section-title fade-in">創作動態</h2>
      <div class="content-subsection fade-in" id="ytSection">
        <h3 class="content-subtitle">影片 / Shorts</h3>
        <div id="ytGrid" class="yt-grid"></div>
      </div>
      <div class="content-subsection fade-in" id="igSection">
        <h3 class="content-subtitle">圖文創作</h3>
        <div id="igGrid" class="ig-grid"></div>
      </div>
      <div class="content-subsection fade-in" id="twitchSection">
        <h3 class="content-subtitle">直播</h3>
        <div id="twitchContainer"></div>
      </div>
    </div>
  </section>

  <!-- ========== Services (videoeditor/illustrator) ========== -->
  <section class="services-section section-toggle" id="services" data-section="services" aria-label="服務項目">
    <div class="container">
      <h2 class="section-title fade-in">服務項目</h2>
      <div id="servicesGrid" class="services-grid"></div>
    </div>
  </section>

  <!-- ========== Live Schedule (vtuber) ========== -->
  <section class="schedule-section section-toggle" id="liveSchedule" data-section="liveSchedule" aria-label="直播時間表">
    <div class="container">
      <h2 class="section-title fade-in" id="scheduleHeading">直播時間表</h2>
      <div id="scheduleGrid" class="schedule-grid"></div>
    </div>
  </section>

  <!-- ========== Stats Bar ========== -->
  <section class="stats-bar section-toggle" id="stats" data-section="stats" aria-label="數據統計">
    <div class="container">
      <div id="statsGrid" class="stats-grid"></div>
    </div>
  </section>

  <!-- ========== About ========== -->
  <section class="about section-toggle" id="about" data-section="about" aria-label="關於我">
    <div class="container">
      <h2 class="section-title fade-in">關於我</h2>
      <div class="about-layout fade-in">
        <div class="about-content" id="aboutContent"></div>
        <aside class="about-side-social" id="aboutSideSocial">
          <h3 class="about-side-title">社群連結</h3>
          <div class="about-social-grid" id="socialIcons"></div>
        </aside>
      </div>
      <div class="about-notices fade-in" id="aboutNoticesWrap">
        <div class="about-notices-head">
          <h3 class="about-notices-title">最新公告</h3>
          <a class="about-notices-more" href="news.html">全部 →</a>
        </div>
        <div class="about-notices-list" id="aboutNoticesList">
          <div class="about-notices-empty">載入中…</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== Support ========== -->
  <section class="support section-toggle" id="support" data-section="support" aria-label="支持我">
    <div class="container fade-in">
      <h2 class="section-title" style="display:block;text-align:center;" id="supportHeading">支持我</h2>
      <p class="support-message" id="supportMessage">如果喜歡我的作品，可以請我喝杯咖啡</p>
      <a href="#" class="support-btn" id="supportBtn" target="_blank" rel="noopener noreferrer">打賞支持</a>
    </div>
  </section>

  <!-- ========== Footer ========== -->
  <footer class="footer" role="contentinfo">
    <p class="footer-copy">&copy; 2025 阿煙 Ryan. All rights reserved.</p>
  </footer>

  <!-- ========== Video Modal ========== -->
  <div class="video-modal" id="videoModal">
    <div class="video-modal-inner">
      <button class="video-modal-close" id="videoModalClose">&times;</button>
      <iframe id="videoModalIframe" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>
  </div>

  <!-- ========== Gallery Lightbox ========== -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <button class="lightbox-prev" id="lightboxPrev">&lsaquo;</button>
    <button class="lightbox-next" id="lightboxNext">&rsaquo;</button>
    <img id="lightboxImg" src="" alt="">
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>

  <script src="js/main.js"></script>
  <script src="js/carousel.js"></script>
  <script data-goatcounter="https://ryan94ryan.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
